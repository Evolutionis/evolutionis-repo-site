<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E4E79">

  <!-- O site é publicado como estático (FTP para a Locaweb), sem servidor de
       aplicação que possa mandar cabeçalhos. A CSP entra por meta tag, que o
       navegador aplica igual, e os cabeçalhos que meta tag não suporta ficam
       no .htaccess ao lado. Camadas diferentes; nenhuma cobre a outra.

       Isto é a rede de segurança dos achados A1 e A2: mesmo que um valor
       hostil escape da validação em src/lib/sanitize.js, script inline e
       javascript: não executam. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' https: data:;
    frame-src https://google.com https://*.google.com https://google.com.br https://*.google.com.br;
    connect-src 'self';
    object-src 'none';
    base-uri 'self';
    form-action 'self'
  ">

  <title>Evolutionis Serviços | Limpeza, Paisagismo e Controle de Pragas</title>
  <meta name="description" content="Há mais de 20 anos em limpeza profissional, paisagismo e controle de pragas para condomínios, empresas e indústrias em São Roque/SP. Acompanhe cada atendimento em tempo real.">

  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Ponto de montagem do React. A ausência dele era o motivo de o app
       nunca subir na versão anterior deste repositório. -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
