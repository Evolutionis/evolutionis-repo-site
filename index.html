<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E4E79">

  <!-- O site é publicado como estático (FTP para a Locaweb), sem servidor de
       aplicação que possa mandar cabeçalhos. A CSP entra por meta tag, que o
       navegador aplica igual, e os cabeçalhos que meta tag não suporta ficam
       no .htaccess ao lado. Camadas diferentes; nenhuma cobre a outra.

       Isto é a rede de segurança dos achados A1 e A2: mesmo que um valor
       hostil escape da validação em src/lib/sanitize.js, script inline e
       javascript: não executam.

       Google Analytics: script-src e connect-src abrem exatamente o que o gtag
       precisa — o domínio que serve o gtag.js e os que recebem a coleta. Nada
       de 'unsafe-inline': a inicialização do gtag mora em analytics-init.js,
       que é 'self'. O custo é real e vale saber: script-src passa a confiar
       num domínio de terceiro, então um comprometimento do lado do Google
       executaria aqui. É o preço de qualquer site com GA. -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' https://www.googletagmanager.com;
    style-src 'self' 'unsafe-inline';
    font-src 'self';
    img-src 'self' https: data:;
    frame-src https://google.com https://*.google.com https://google.com.br https://*.google.com.br;
    connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com;
    object-src 'none';
    base-uri 'self';
    form-action 'self'
  ">

  <!-- Endereço oficial: https sem www. www e http redirecionam para cá (.htaccess). -->
  <link rel="canonical" href="https://evolutionis.com.br/">

  <title>Evolutionis Serviços | Limpeza, Paisagismo e Controle de Pragas</title>
  <meta name="description" content="Há mais de 20 anos em limpeza profissional, paisagismo e controle de pragas para condomínios, empresas e indústrias em São Roque/SP. Acompanhe cada atendimento em tempo real.">

  <!-- Google tag (gtag.js). O bloco inline que o Google entrega foi para
       analytics-init.js — a CSP não deixa script inline rodar.
       O ID precisa ser o mesmo nos dois arquivos (aqui e no `config` do init).
       `defer`: sem ele o init bloqueava a renderização (PageSpeed). A ordem
       continua garantida — roda antes do main.jsx, que também é adiado. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-LWMTQL9KPM"></script>
  <script defer src="%BASE_URL%analytics-init.js"></script>
  <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png">
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png">

</head>
<body>
  <!-- Ponto de montagem do React. A ausência dele era o motivo de o app
       nunca subir na versão anterior deste repositório. -->
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
