# Produção. Publica na RAIZ (public_html/) a cada push na `main`.
#
# A `main` só recebe commit pelo botão "Promover para produção" do painel, que
# copia para cá o content.json já conferido em homologação.
name: Deploy producao (raiz) - build React + FTP Locaweb

on:
  push:
    branches:
      - "main"
    paths:
      - "public/content.json"
      - "public/images/**"
      - "src/**"
      - "index.html"
      - "package.json"
      - "vite.config.js"
  workflow_dispatch: # permite rodar manualmente pela aba Actions

# Achado M5: sem este bloco o workflow herda a permissão padrão do
# repositório, que pode ser de escrita. Nada aqui escreve no repositório.
permissions:
  contents: read

jobs:
  # Igual ao de homologação: o build roda sem `environment`, então os scripts
  # de instalação das dependências nunca veem as credenciais de FTP.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: ""

      - name: Instalar dependencias
        run: npm ci

      - name: Build
        # Sem isto o build sai com os caminhos apontando para /preview/ e, na
        # raiz, nenhum arquivo carrega — a página abre em branco, sem erro
        # visível no servidor.
        run: npm run build
        env:
          VITE_BASE: /

      - name: Guardar o dist para o job de deploy
        uses: actions/upload-artifact@v4
        with:
          name: site-producao
          path: dist/
          retention-days: 1
          # O .htaccess dos cabeçalhos de segurança começa com ponto, e o
          # padrão da action é ignorar arquivos ocultos.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: producao
    steps:
      - name: Baixar o dist do job de build
        uses: actions/download-artifact@v4
        with:
          name: site-producao
          path: dist/

      - name: Deploy via FTP (Locaweb) - raiz
        # Achado M5: fixado no SHA da v4.3.5. Uma tag pode ser reapontada por
        # quem controla o repositório da action, e a versão nova receberia
        # estas credenciais de FTP. O SHA não se move.
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          local-dir: ./dist/
          server-dir: ./public_html/
          # dangerous-clean-slate: false e obrigatorio aqui. Com true, a acao
          # APAGA tudo em public_html/ antes de enviar — inclusive a pasta
          # preview/ e qualquer coisa que ja exista na hospedagem.
          dangerous-clean-slate: false
          # Nao mexe na pasta de homologacao nem em arquivos do servidor.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            preview/**
